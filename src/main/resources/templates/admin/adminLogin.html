<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>관리자 로그인</title>
  <!-- Bootstrap CSS + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    body {
      background:
        url('/images/adminLoginBg.png') center/cover no-repeat,
        linear-gradient(135deg, rgba(78,115,223,0.7) 0%, rgba(34,74,190,0.7) 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .login-card {
      border: none;
      border-radius: 1rem;
      box-shadow: 0 0.5rem 1.5rem rgba(0,0,0,0.3);
      width: 380px;
    }
    .login-header {
      background: #fff;
      padding: 1.5rem;
    }
    .login-header img {
      width: 80px;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
<div class="card login-card">
  <!-- 헤더: 로고 + 제목 중앙 정렬 -->
  <div class="login-header d-flex align-items-center justify-content-center">
    <img src="/images/adminLogin.png" alt="학원관리 시스템 로고" style="height:50px; margin-right:10px;">
    <h5 class="mb-0">관리자 로그인</h5>
  </div>

  <div class="card-body p-4 bg-white">

    <!-- 안내 영역 -->
    <!-- 가입 성공 -->
    <div th:if="${param.signupSuccess}" class="alert alert-success d-flex align-items-center mb-3" role="alert">
      <i class="bi bi-check-circle-fill me-2"></i>
      <div>회원가입이 완료되었습니다. 로그인해 주세요.</div>
    </div>

    <!-- 로그아웃 -->
    <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center mb-3" role="alert">
      <i class="bi bi-box-arrow-right me-2"></i>
      <div>로그아웃 되었습니다.</div>
    </div>

    <!-- 로그인 실패 (사유별 분기: bad / locked / disabled / expired / temporary) -->
    <div th:if="${param.error}" class="mb-3">
      <div th:switch="${param.error[0]}">
        <!-- NEW: temporary -->
        <div th:case="'temporary'" class="alert alert-secondary d-flex align-items-center" role="alert">
          <i class="bi bi-info-circle-fill me-2"></i>
          <div>계정신청 상태 입니다. 관리자에게 문의 바랍니다.</div>
        </div>

        <!-- 기존 분기들 -->
        <div th:case="'locked'" class="alert alert-warning d-flex align-items-center" role="alert">
          <i class="bi bi-lock-fill me-2"></i>
          <div>계정이 잠겼습니다. 관리자에게 문의하세요.</div>
        </div>
        <div th:case="'disabled'" class="alert alert-secondary d-flex align-items-center" role="alert">
          <i class="bi bi-slash-circle me-2"></i>
          <div>비활성화된 계정입니다. 관리자에게 문의하세요.</div>
        </div>
        <div th:case="'expired'" class="alert alert-info d-flex align-items-center" role="alert">
          <i class="bi bi-hourglass-split me-2"></i>
          <div>만료된 계정/자격입니다. 관리자에게 문의하세요.</div>
        </div>
        <div th:case="*" class="alert alert-danger d-flex align-items-center" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>
          <div>아이디 또는 비밀번호가 올바르지 않습니다.</div>
        </div>
      </div>
    </div>

    <form th:action="@{/admin/login}" method="post">
      <!-- CSRF -->
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <!-- 관리자 ID -->
      <div class="input-group mb-3">
        <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
        <input type="text" class="form-control" id="userId" name="userId"
               placeholder="관리자 ID" required autofocus autocomplete="username"/>
      </div>

      <!-- 비밀번호 -->
      <div class="input-group mb-4">
        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
        <input type="password" class="form-control" id="password" name="password"
               placeholder="비밀번호" required autocomplete="current-password"/>
      </div>

      <!-- 로그인 버튼 -->
      <div class="d-grid mb-3">
        <button type="submit" class="btn btn-primary btn-lg">로그인</button>
      </div>

      <!-- 신규등록 / 비밀번호 찾기 버튼 -->
      <div class="row g-2">
        <div class="col">
          <a th:href="@{/admin/sign/signup}" class="btn btn-outline-secondary w-100">
            신규등록
          </a>
        </div>
        <div class="col">
          <a th:href="@{/admin/sign/forgot-password}" class="btn btn-outline-secondary w-100">
            비밀번호 찾기
          </a>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

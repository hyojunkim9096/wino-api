<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <!-- 레이아웃으로 전달할 타이틀 조각 -->
  <title th:fragment="page_title">관리자 메인보드 - WINO</title>
</head>
<body>
<!-- 레이아웃에 본문/타이틀 프래그먼트를 넘겨주기 -->
<div th:replace="~{layout/admin-layout :: layout(~{::page_title}, ~{::page_content})}">
  <!-- 본문 프래그먼트 -->
  <main th:fragment="page_content">
    <div class="row g-3">
      <div class="col-12 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-header">요약</div>
          <div class="card-body">
            <p class="mb-0 text-muted">여기에 핵심 지표/요약 카드들.</p>
          </div>
        </div>
      </div>
      <div class="col-12 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-header">알림</div>
          <div class="card-body">
            <ul class="mb-0">
              <li>최근 활동 로그…</li>
              <li>시스템 점검 일정…</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>

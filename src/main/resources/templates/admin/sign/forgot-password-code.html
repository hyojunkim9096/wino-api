<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>인증코드 발송 - WINO Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/auth.css" rel="stylesheet"/>
</head>
<body class="auth-page auth-bg">
<div class="w-100 px-3" style="max-width:460px;">
    <div class="card auth-card text-center">
        <div class="card-header py-3">
            <div class="fw-bold">WINO Admin</div>
            <div class="small text-muted">이메일 인증코드 발송</div>
        </div>
        <div class="card-body p-4">
            <p class="mb-2">아이디에 등록된 이메일로 <strong>6자리 인증코드</strong>를 보냈어요.</p>
            <p class="text-muted small">메일함(스팸함 포함)을 확인한 뒤 아래 버튼으로 이동해 코드를 입력해 주세요.</p>
            <a class="btn btn-dark w-100" th:href="@{|/admin/sign/verify-code?userId=${userId}|}">코드 입력하러 가기</a>
            <a class="btn btn-outline-secondary w-100 mt-2" th:href="@{/admin/sign/forgot-password}">다시 보내기</a>
        </div>
    </div>
    <p class="text-center small mt-3 mb-0 footer-copy">© WINO</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

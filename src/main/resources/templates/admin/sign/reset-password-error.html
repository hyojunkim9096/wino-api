<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>처리 오류 - WINO Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/auth.css" rel="stylesheet"/>
</head>
<body class="auth-page auth-bg">
<div class="w-100 px-3" style="max-width:460px;">
    <div class="card auth-card">
        <div class="card-header py-3 text-center"><div class="fw-bold">WINO Admin</div></div>
        <div class="card-body p-4">
            <div class="alert alert-danger" th:text="${error}">처리 중 오류가 발생했습니다.</div>
            <div class="d-grid gap-2">
                <a class="btn btn-dark" th:href="@{/admin/sign/forgot-password}">다시 시도</a>
                <a class="btn btn-outline-secondary" th:href="@{/admin/login}">로그인으로 이동</a>
            </div>
        </div>
    </div>
    <p class="text-center small mt-3 mb-0 footer-copy">© WINO</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

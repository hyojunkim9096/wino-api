<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>관리자 신규등록 - WINO Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/auth.css" rel="stylesheet"/>
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</head>
<body class="auth-page auth-bg">

<!-- 카드 + 바깥 푸터를 같은 폭으로 묶는 래퍼 -->
<div class="auth-box auth-card--wide">

    <div class="card auth-card auth-card--wide">
        <div class="card-header text-center py-3">
            <div class="fw-bold">WINO Admin</div>
            <div class="small text-muted">관리자 신규등록</div>
        </div>

        <div class="card-body p-4">
            <div class="mb-2 text-center small">
                <span th:if="${param.ok}" class="text-success">등록이 완료되었습니다.</span>
                <span th:if="${param.error}" class="text-danger" th:text="${param.error}">등록 중 오류가 발생했습니다.</span>
            </div>

            <form th:action="@{/admin/sign/signUp}" th:object="${adminSignupDto}" method="post" id="signupForm" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <!-- ① 계정 -->
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="userId">아이디</label>
                        <input id="userId" th:field="*{userId}" class="form-control" placeholder="예) admin" required/>
                        <div class="text-danger" th:if="${#fields.hasErrors('userId')}" th:errors="*{userId}"></div>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="email">이메일</label>
                        <input id="email" th:field="*{email}" type="email" class="form-control" placeholder="you@example.com" required/>
                        <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label" for="password">비밀번호</label>
                        <input id="password" th:field="*{password}" type="password" class="form-control" placeholder="8자 이상" minlength="8" required/>
                        <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="confirmPassword">비밀번호 확인</label>
                        <input id="confirmPassword" th:field="*{confirmPassword}" type="password" class="form-control" minlength="8" required/>
                        <div class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                    </div>
                </div>

                <hr class="my-4"/>

                <!-- ② 기본 정보(요청대로: 이름 ↔ 직원구분 같은 줄) -->
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="userName">이름</label>
                        <input id="userName" th:field="*{userName}" class="form-control" required/>
                        <div class="text-danger" th:if="${#fields.hasErrors('userName')}" th:errors="*{userName}"></div>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="employeeType">직원 구분</label>
                        <select id="employeeType" th:field="*{employeeType}" class="form-select" required>
                            <option value="" disabled>선택하세요</option>
                            <option value="STAFF">직원</option>
                            <option value="TEACHER">강사</option>
                        </select>
                        <div class="text-danger" th:if="${#fields.hasErrors('employeeType')}" th:errors="*{employeeType}"></div>
                    </div>
                </div>

                <!-- ③ 연락처(요청대로: 휴대폰 ↔ 비상연락처 같은 줄) -->
                <div class="row g-3 mt-0">
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="phoneNumber">휴대폰 번호</label>
                        <input id="phoneNumber" th:field="*{phoneNumber}" class="form-control"
                               placeholder="01012341234" inputmode="numeric" pattern="\\d{9,11}"/>
                        <div class="text-danger" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="emergencyContact">비상 연락처</label>
                        <input id="emergencyContact" th:field="*{emergencyContact}" class="form-control"
                               placeholder="예) 01098765432" inputmode="numeric" pattern="\\d{9,11}"/>
                        <div class="text-danger" th:if="${#fields.hasErrors('emergencyContact')}" th:errors="*{emergencyContact}"></div>
                    </div>
                </div>

                <hr class="my-4"/>

                <!-- ④ 주소 -->
                <div class="row g-3">
                    <div class="col-12 col-lg-4">
                        <label class="form-label" for="postalCode">우편번호</label>
                        <div class="input-group">
                            <input id="postalCode" th:field="*{postalCode}" class="form-control" placeholder="우편번호" readonly/>
                            <button type="button" class="btn btn-outline-secondary" id="btnPostcode">검색</button>
                        </div>
                    </div>
                    <div class="col-12 col-lg-8">
                        <label class="form-label" for="address">도로명 주소</label>
                        <input id="address" th:field="*{address}" class="form-control" placeholder="도로명 주소" readonly/>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="detailAddress">상세 주소</label>
                        <input id="detailAddress" th:field="*{detailAddress}" class="form-control" placeholder="상세 주소"/>
                    </div>
                </div>

                <!-- ⑤ 액션(가운데 정렬) -->
                <div class="d-flex justify-content-center gap-2 flex-wrap mt-4">
                    <a class="btn btn-outline-secondary" th:href="@{/admin/login}">취소</a>
                    <button id="submitBtn" type="submit" class="btn btn-dark">등록하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 로그인처럼 카드 바깥, 카드와 같은 폭으로 딱 붙는 푸터 -->
    <p class="footer-copy footer-tight">© WINO</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 숫자만: 휴대폰 & 비상연락처
    const onlyDigits = (el)=>el.addEventListener('input',()=>{ el.value = el.value.replace(/\D/g,''); });
    const phone = document.getElementById('phoneNumber');
    const emer  = document.getElementById('emergencyContact');
    if (phone) onlyDigits(phone);
    if (emer)  onlyDigits(emer);

    // 우편번호 검색
    document.getElementById('btnPostcode')?.addEventListener('click', function(){
      new daum.Postcode({
        oncomplete: function(data){
          document.getElementById('postalCode').value = data.zonecode || '';
          document.getElementById('address').value    = data.roadAddress || data.jibunAddress || '';
          document.getElementById('detailAddress').focus();
        }
      }).open();
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>코드 인증 - WINO Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/auth.css" rel="stylesheet"/>
    <style>.toggle-eye{cursor:pointer;user-select:none;}</style>
</head>
<body class="auth-page auth-bg">
<div class="w-100 px-3" style="max-width:460px;">
    <div class="card auth-card">
        <div class="card-header text-center py-3">
            <div class="fw-bold">WINO Admin</div>
            <div class="small text-muted">이메일 코드 인증</div>
        </div>
        <div class="card-body p-4">
            <div class="feedback-slot">
                <div th:if="${error}" class="alert alert-danger small" th:text="${error}"></div>
            </div>

            <p class="text-muted small mb-3">메일로 받은 6자리 코드를 입력하고 새 비밀번호를 설정하세요.</p>

            <form method="post" th:action="@{/admin/sign/reset-password-by-code}" id="verifyForm" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="userId" th:value="${param.userId}"/>

                <div class="mb-3">
                    <label class="form-label">인증코드 (6자리)</label>
                    <input type="text" id="code" name="code" class="form-control" inputmode="numeric" pattern="\\d{6}" maxlength="6" required placeholder="예) 123456"/>
                    <div class="form-text">숫자 6자리를 입력해 주세요.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">새 비밀번호</label>
                    <div class="input-group">
                        <input id="password" name="password" type="password" class="form-control" minlength="8" required aria-describedby="pwHelp"/>
                        <span class="input-group-text toggle-eye" data-target="password">👁</span>
                    </div>
                    <div id="pwHelp" class="form-text">8~32자 권장 (영문/숫자/특수문자 조합 권장)</div>
                </div>

                <div class="mb-2">
                    <label class="form-label">비밀번호 확인</label>
                    <div class="input-group">
                        <!-- ✅ 컨트롤러는 name="passwordConfirm" 을 받음 -->
                        <input id="confirm" name="passwordConfirm" type="password" class="form-control" minlength="8" required/>
                        <span class="input-group-text toggle-eye" data-target="confirm">👁</span>
                    </div>
                </div>

                <button id="submitBtn" class="btn btn-dark w-100" type="submit" disabled>비밀번호 변경</button>
            </form>

            <div class="text-center mt-3">
                <a th:href="@{/admin/login}" class="small">← 로그인으로 돌아가기</a>
            </div>
        </div>
    </div>
    <p class="text-center small mt-3 mb-0 footer-copy">© WINO</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('.toggle-eye').forEach(el=>{
      el.addEventListener('click',()=>{
        const id=el.getAttribute('data-target');
        const input=document.getElementById(id);
        input.type=(input.type==='password'?'text':'password');
      });
    });

    const code=document.getElementById('code'), pw=document.getElementById('password'), cf=document.getElementById('confirm'), btn=document.getElementById('submitBtn');
    const codeOK=v=>/^\d{6}$/.test(v);
    const pwOK=v=>v.length>=8 && v.length<=32;
    function render(){ btn.disabled=!(codeOK(code.value) && pwOK(pw.value) && pw.value===cf.value); }
    [code,pw,cf].forEach(el=>el.addEventListener('input',render));
    render();

    document.getElementById('verifyForm')?.addEventListener('submit', function(){
      btn.disabled=true; btn.innerHTML='<span class="spinner-border spinner-border-sm me-2"></span>처리 중…';
    });
</script>
</body>
</html>

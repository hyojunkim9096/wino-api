<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>코드 인증</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/></head>
<body class="container py-5">
<h3 class="mb-3">이메일 코드 인증</h3>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<form method="post" th:action="@{/admin/sign/reset-password-by-code}">
    <input type="hidden" name="userId" th:value="${userId}"/>
    <div class="mb-3">
        <label class="form-label">인증코드 (6자리)</label>
        <input type="text" name="code" class="form-control" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code" required/>
    </div>
    <div class="mb-3">
        <label class="form-label">새 비밀번호</label>
        <input type="password" name="password" class="form-control" minlength="8" required/>
    </div>
    <div class="mb-3">
        <label class="form-label">새 비밀번호 확인</label>
        <input type="password" name="passwordConfirm" class="form-control" minlength="8" required/>
    </div>
    <button class="btn btn-success w-100">비밀번호 변경</button>
</form>
</body></html>

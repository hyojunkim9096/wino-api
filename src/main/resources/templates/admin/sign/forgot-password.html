<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>비밀번호 찾기 - WINO Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/auth.css" rel="stylesheet"/>
</head>
<body class="auth-page auth-bg">
<div class="w-100 px-3" style="max-width:460px;">
    <div class="card auth-card">
        <div class="card-header text-center py-3">
            <div class="fw-bold">WINO Admin</div>
            <div class="small text-muted">비밀번호 재설정</div>
        </div>
        <div class="card-body p-4">
            <div th:if="${param.sent}" class="alert alert-success small">인증코드를 보냈습니다. 메일함을 확인해 주세요.</div>
            <div th:if="${param.error}" class="alert alert-danger small" th:text="${param.error}"></div>

            <p class="text-muted small mb-3">가입한 <strong>아이디</strong>만 입력하면 해당 이메일로 안내가 발송됩니다.</p>

            <form method="post" th:action="@{/admin/sign/forgot-password}" id="forgotForm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label class="form-label" for="userId">아이디</label>
                    <input id="userId" name="userId" class="form-control" placeholder="예) admin" required autofocus/>
                </div>
                <button id="submitBtn" type="submit" class="btn btn-dark w-100">인증코드 보내기</button>
            </form>

            <div class="d-flex justify-content-between align-items-center mt-3">
                <a th:href="@{/admin/login}" class="small">← 로그인으로 돌아가기</a>
                <a th:href="@{/admin/sign/signUp}" class="small">신규등록</a>
            </div>
        </div>
    </div>
    <p class="text-center small mt-3 mb-0 footer-copy">© WINO</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('forgotForm')?.addEventListener('submit', function(){
      const btn=document.getElementById('submitBtn');
      btn.disabled=true; btn.innerHTML='<span class="spinner-border spinner-border-sm me-2"></span>전송 중…';
    });
</script>
</body>
</html>

<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>비밀번호 찾기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/></head>
<body class="container py-5">
<h3 class="mb-3">비밀번호 찾기</h3>
<form method="post" th:action="@{/admin/sign/forgot-password}">
    <div class="mb-3">
        <label class="form-label">사용자 ID</label>
        <input type="text" name="userId" class="form-control" required/>
    </div>
    <button class="btn btn-primary w-100">이메일로 인증코드 받기</button>
</form>
</body></html>

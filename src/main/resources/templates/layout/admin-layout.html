<!-- src/main/resources/templates/layout/admin-layout.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(pageTitle, content)">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:replace="${pageTitle}">WINO Admin</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- 공통 CSS -->
  <link href="/css/admin-layout.css" rel="stylesheet"/>
  <link href="/css/admin-theme.css" rel="stylesheet"/>

  <!-- CSRF (있으면 자동 사용) -->
  <meta th:if="${_csrf}" name="_csrf" th:content="${_csrf.token}"/>
  <meta th:if="${_csrf}" name="_csrf_header" th:content="${_csrf.headerName}"/>

  <!-- 세션 타이머 스크립트 -->
  <script src="/js/admin-session-timer.js" defer></script>
</head>
<body>
<div id="admin-layout">
  <div th:replace="~{layout/header/admin-header :: adminHeader}"></div>
  <aside id="admin-sidebar" th:replace="~{layout/sidebar/admin-left-menu :: adminLeft}"></aside>
  <main id="admin-content" class="container-fluid">
    <div th:replace="${content}"></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

# =========================
# 서버 포트 (Cloud Run 등 기본 8080)
# =========================
server.port=8080

# =========================
# DB 연결 (운영은 환경변수/시크릿 사용 권장)
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA 설정
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =========================
# AES/JWT (환경변수로 주입)
# =========================
aes.secret-key=${AES_SECRET_KEY}
jwt.secret=${JWT_SECRET_KEY}
jwt.expiration-ms=3600000

# =========================
# MyBatis
# =========================
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.wino.wino_api.entity

# =========================
# 정적 리소스
# =========================
spring.web.resources.static-locations=classpath:/static/

# =========================
# Thymeleaf (운영은 캐시 ON 권장)
# =========================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=true

# =========================
# 로그 (운영은 INFO 이상)
# =========================
logging.level.root=INFO
logging.level.com.wino=INFO
logging.pattern.console=[%d{yyyy-MM-dd HH:mm:ss}] [%level] %logger{36} - %msg%n

# =====================================================================
# 메일(SMTP) - AWS SES 예시 (서울: ap-northeast-2)
#  - 반드시 SES 콘솔에서 '보내는 주소/도메인'을 인증(SPF/DKIM/DMARC)해야 스팸함 이슈가 줄어듭니다.
#  - SES SMTP 자격증명(사용자/비밀번호)을 환경변수로 주입하세요.
#  - 리전이 다르면 host를 해당 리전으로 변경하세요.
# =====================================================================
spring.mail.host=email-smtp.ap-northeast-2.amazonaws.com
spring.mail.port=587
spring.mail.username=${SES_SMTP_USER}       # SES에서 받은 SMTP Username
spring.mail.password=${SES_SMTP_PASS}       # SES에서 받은 SMTP Password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=true            # 부팅 시 연결 확인(실패 시 즉시 파악)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# 앱 메일 옵션
# - From은 'SES에서 검증된 주소'여야 함 (예: support@yourdomain.com).
# - 필요하면 환경변수로 관리: app.mail.from=${MAIL_FROM:WINO Support <support@yourdomain.com>}
app.mail.enabled=true
app.mail.brand=WINO
app.mail.from=WINO Support <support@yourdomain.com>

# (선택) 운영에서도 private override 파일을 허용하고 싶다면 주석 해제
# spring.config.import=optional:classpath:application-prod-private.properties,optional:file:./application-prod-private.properties

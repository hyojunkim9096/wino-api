# 서버 포트 (Cloud Run 등에서는 기본값 8080, 생략해도 무방)
server.port=8080

# DB 연결 (환경변수 사용 권장)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# AES 암호화 키 (환경변수로 설정)
aes.secret-key=${AES_SECRET_KEY}

# JWT 설정
jwt.secret=${JWT_SECRET_KEY}
jwt.expiration-ms=3600000

# MyBatis
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.wino.wino_api.entity

# 정적 리소스
spring.web.resources.static-locations=classpath:/static/

# Thymeleaf (캐시 ON → 운영환경에서는 성능상 권장)
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=true

# 로그 (운영환경에서는 DEBUG 대신 INFO 이상만)
logging.level.root=INFO
logging.level.com.wino=INFO
logging.pattern.console=[%d{yyyy-MM-dd HH:mm:ss}] [%level] %logger{36} - %msg%n